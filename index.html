<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <h1>CARRO DE COMPRAS</h1>
    <div class="contenedor">
        <h2>Aregar producto</h2>
        <form id="formulario">
            <input type="text" id="inputProducto" placeholder="ingrese un nuevo producto">
            <input type="submit" id="sumarProducto" value="Agrgar">
        </form>
        <div>
            <table class="listaFinal"> <!--inicio y fin table-->
                <thead> <!--encabezado-->
                    <tr> <!--fila-->
                        <th>Producto</th> <!--celda encabezado/columna-->
                        <th>Cantidad</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody></tbody> <!--cuerpo tabla-->
            </table> <!--inicio y fin table-->
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
